<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>AtCoder Heuristic Contest Visualizer</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    .input-container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .input-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .input-area label {
      font-weight: bold;
      margin-bottom: 5px;
    }
    .input-area textarea {
      width: 100%;
      height: 150px;
      resize: vertical;
    }
    .visualization-container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    /* キャンバスサイズを800×800に変更 */
    #myCanvas {
      border: 1px solid #ccc;
      width: 800px;
      height: 800px;
    }
    .info {
      min-width: 220px;
    }
    .legend {
      margin-bottom: 20px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }
    .color-box {
      width: 15px;
      height: 15px;
      margin-right: 5px;
      border: 1px solid #000;
    }
    .error-sum {
      margin-bottom: 10px;
    }
    button {
      margin-bottom: 20px;
      padding: 5px 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>AtCoder Heuristic Contest Visualizer</h1>
  
  <div class="input-container">
    <div class="input-area">
      <label for="inputText">Input</label>
      <textarea id="inputText" placeholder="問題の入力＋各都市の真の座標（N行分）"></textarea>
    </div>
    <div class="input-area">
      <label for="estimate1Text">Estimate1</label>
      <textarea id="estimate1Text" placeholder="各行に 'x y' の形式"></textarea>
    </div>
    <div class="input-area">
      <label for="estimate2Text">Estimate2</label>
      <textarea id="estimate2Text" placeholder="各行に 'x y' の形式"></textarea>
    </div>
  </div>
  
  <button id="drawButton">描画開始</button>
  
  <div class="visualization-container">
    <canvas id="myCanvas" width="800" height="800"></canvas>
    <div class="info">
      <div class="legend">
        <div class="legend-item">
          <div class="color-box" style="background: red;"></div>
          <span>真の座標</span>
        </div>
        <div class="legend-item">
          <div class="color-box" style="background: blue;"></div>
          <span>推定座標1</span>
        </div>
        <div class="legend-item">
          <div class="color-box" style="background: green;"></div>
          <span>推定座標2</span>
        </div>
      </div>
      <div class="error-sum">
        <div id="errorSum1">真の座標と推定座標1の距離の合計: 0</div>
        <div id="errorSum2">真の座標と推定座標2の距離の合計: 0</div>
      </div>
    </div>
  </div>
  
  <script>
    // グローバル変数として、各都市のデータを保持する配列
    let citiesData = [];
    let canvas, ctx;
    const SCALE_FACTOR = 0.08;  // 10000->800
    const NORMAL_RADIUS = 2;    // 通常の円の半径
    const HIGHLIGHT_RADIUS = 4; // 強調表示時の円の半径
    let N = 0;
    
    // テキストから数字を抽出するユーティリティ
    function parseNumbers(text) {
      return text.trim().split(/\s+/).map(Number);
    }
    
    // Inputエリアの内容をパースする（Header行、G配列、各都市の矩形情報、真の座標情報）
    function parseInput(inputText) {
      const lines = inputText.trim().split('\n').map(line => line.trim()).filter(line => line !== '');
      if(lines.length < 2) {
        alert("Inputテキストが不足しています。");
        return null;
      }
      // 1行目: N, M, Q, L, W
      const header = parseNumbers(lines[0]);
      if(header.length < 5) {
        alert("最初の行に5個の数字が必要です。");
        return null;
      }
      const N_val = header[0];
      // 2行目: G配列（M個の数字）
      const G = parseNumbers(lines[1]);
      const M = G.length;
      // 次のN行: 各都市のlx, rx, ly, ry
      const rectLines = lines.slice(2, 2 + N_val);
      if(rectLines.length < N_val) {
        alert("都市の矩形情報が不足しています。");
        return null;
      }
      const rects = rectLines.map(line => parseNumbers(line));
      // 続くN行: 真の座標 (x, y)
      const trueCoordLines = lines.slice(2 + N_val, 2 + 2 * N_val);
      if(trueCoordLines.length < N_val) {
        alert("真の座標情報が不足しています。");
        return null;
      }
      const trueCoords = trueCoordLines.map(line => parseNumbers(line));
      
      return {
        N: N_val,
        M: M,
        Q: header[2],
        L: header[3],
        W: header[4],
        G: G,
        rects: rects,
        trueCoords: trueCoords
      };
    }
    
    // Estimateエリアの内容をパースする：各行 "x y"
    function parseEstimates(text) {
      const lines = text.trim().split('\n').map(line => line.trim()).filter(line => line !== '');
      return lines.map(line => {
        const nums = parseNumbers(line);
        if(nums.length < 2) {
          return [0, 0];
        }
        return [nums[0], nums[1]];
      });
    }
    
    // 0～10000の座標を800×800のキャンバスに線形スケール
    function scaleCoord(val) {
      return val * SCALE_FACTOR;
    }
    
    // キャンバスに円を描画する関数（オプションでstrokeも描画）
    function drawCircle(x, y, radius, color, highlight=false) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, 2 * Math.PI);
      ctx.fillStyle = color;
      ctx.fill();
      if(highlight) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = "black";
        ctx.stroke();
      }
    }
    
    // 全体描画関数。hoveredIndex: カーソルオーバー中の都市のインデックス（なければnull）
    function drawAll(hoveredIndex) {
      // キャンバスクリア
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // 誤差の合計計算（元の座標で計算し、Math.floorして和を出す）
      let errorSum1 = 0;
      let errorSum2 = 0;
      for (let i = 0; i < N; i++) {
        const city = citiesData[i];
        if(city.est1) {
          const dx = city.originalTrue.x - city.originalEst1.x;
          const dy = city.originalTrue.y - city.originalEst1.y;
          errorSum1 += Math.floor(Math.sqrt(dx*dx + dy*dy));
        }
        if(city.est2) {
          const dx = city.originalTrue.x - city.originalEst2.x;
          const dy = city.originalTrue.y - city.originalEst2.y;
          errorSum2 += Math.floor(Math.sqrt(dx*dx + dy*dy));
        }
      }
      document.getElementById("errorSum1").innerText = "真の座標と推定座標1の距離の合計: " + errorSum1;
      document.getElementById("errorSum2").innerText = "真の座標と推定座標2の距離の合計: " + errorSum2;
      
      // 各都市の描画
      for (let i = 0; i < N; i++) {
        const city = citiesData[i];
        // true座標の描画
        if(i === hoveredIndex) {
          // 強調表示の場合：少し大きめに描画し、stroke追加
          drawCircle(city.scaledTrue.x, city.scaledTrue.y, NORMAL_RADIUS, "red", true);
          // 存在範囲（矩形）の描画（半透明の赤）
          ctx.fillStyle = "rgba(255,0,0,0.2)";
          ctx.fillRect(city.scaledRect.left, city.scaledRect.top, city.scaledRect.width, city.scaledRect.height);
          
          // 推定座標の強調表示
          if(city.est1) {
            drawCircle(city.scaledEst1.x, city.scaledEst1.y, HIGHLIGHT_RADIUS, "blue", true);
          }
          if(city.est2) {
            drawCircle(city.scaledEst2.x, city.scaledEst2.y, HIGHLIGHT_RADIUS, "green", true);
          }
        } else {
          // 通常描画
          drawCircle(city.scaledTrue.x, city.scaledTrue.y, NORMAL_RADIUS, "red");
          if(city.est1) {
            drawCircle(city.scaledEst1.x, city.scaledEst1.y, NORMAL_RADIUS, "blue");
          }
          if(city.est2) {
            drawCircle(city.scaledEst2.x, city.scaledEst2.y, NORMAL_RADIUS, "green");
          }
        }
      }
    }
    
    // マウス座標をキャンバス上の座標に変換する
    function getMousePos(evt) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: evt.clientX - rect.left,
        y: evt.clientY - rect.top
      };
    }
    
    // マウスが真の座標の円に近いかチェックする
    function findHoveredCity(mousePos) {
      for (let i = 0; i < N; i++) {
        const city = citiesData[i];
        const dx = mousePos.x - city.scaledTrue.x;
        const dy = mousePos.y - city.scaledTrue.y;
        if(Math.sqrt(dx*dx + dy*dy) <= 4) {  // 4pxの閾値
          return i;
        }
      }
      return null;
    }
    
    // 初期描画とデータ作成
    document.getElementById("drawButton").addEventListener("click", function(){
      const inputText = document.getElementById("inputText").value;
      const estimate1Text = document.getElementById("estimate1Text").value;
      const estimate2Text = document.getElementById("estimate2Text").value;
      
      const inputData = parseInput(inputText);
      if(!inputData) return;
      N = inputData.N;
      const trueCoords = inputData.trueCoords; // N行分
      const rects = inputData.rects;           // N行分
      
      const est1Raw = parseEstimates(estimate1Text);
      const est2Raw = parseEstimates(estimate2Text);
      
      // 真の座標は必ずN個あるはず
      if(trueCoords.length !== N) {
        alert("真の座標の数がNと一致しません。");
        return;
      }
      
      // citiesData配列を初期化
      citiesData = [];
      for(let i = 0; i < N; i++){
        const originalTrue = { x: trueCoords[i][0], y: trueCoords[i][1] };
        const scaledTrue = { 
          x: scaleCoord(originalTrue.x), 
          y: scaleCoord(originalTrue.y) 
        };
        // rect: [lx, rx, ly, ry]
        const origRect = { x: rects[i][0], rx: rects[i][1], y: rects[i][2], ry: rects[i][3] };
        const scaledRect = {
          left: scaleCoord(origRect.x),
          top: scaleCoord(origRect.y),
          width: scaleCoord(origRect.rx - origRect.x),
          height: scaleCoord(origRect.ry - origRect.y)
        };
        // 推定座標が存在するかチェック
        let originalEst1 = null, scaledEst1 = null;
        if(i < est1Raw.length) {
          originalEst1 = { x: est1Raw[i][0], y: est1Raw[i][1] };
          scaledEst1 = { x: scaleCoord(originalEst1.x), y: scaleCoord(originalEst1.y) };
        }
        let originalEst2 = null, scaledEst2 = null;
        if(i < est2Raw.length) {
          originalEst2 = { x: est2Raw[i][0], y: est2Raw[i][1] };
          scaledEst2 = { x: scaleCoord(originalEst2.x), y: scaleCoord(originalEst2.y) };
        }
        citiesData.push({
          originalTrue: originalTrue,
          scaledTrue: scaledTrue,
          rect: origRect,
          scaledRect: scaledRect,
          est1: originalEst1 ? true : false,
          originalEst1: originalEst1,
          scaledEst1: scaledEst1,
          est2: originalEst2 ? true : false,
          originalEst2: originalEst2,
          scaledEst2: scaledEst2
        });
      }
      
      // キャンバスとコンテキスト取得
      canvas = document.getElementById("myCanvas");
      ctx = canvas.getContext("2d");
      
      // 初期描画
      drawAll(null);
    });
    
    // キャンバス上でマウス移動時のハンドラ
    document.getElementById("myCanvas").addEventListener("mousemove", function(evt){
      if(citiesData.length === 0) return;
      const mousePos = getMousePos(evt);
      const hoveredCity = findHoveredCity(mousePos);
      drawAll(hoveredCity);
    });
    
    // マウスアウト時はハイライトを解除
    document.getElementById("myCanvas").addEventListener("mouseout", function(){
      drawAll(null);
    });
  </script>
</body>
</html>
